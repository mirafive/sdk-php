name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pint, PHPStan and Pest on PHP 8.3 (lowest dependencies) and 8.5 (highest)
    uses: mirafive/.github/.github/workflows/php-sdk.yml@d99bb0580ad7349345520d9dd4f9d49d62c3d060
    with:
      contract: true
