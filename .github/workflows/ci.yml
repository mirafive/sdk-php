name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pint, PHPStan and Pest on PHP 8.3 (lowest dependencies) and 8.5 (highest)
    uses: mirafive/.github/.github/workflows/php-sdk.yml@8fd9aaaaa1dbe9d0abc57f6174990f39cf6973bf
    with:
      contract: true
