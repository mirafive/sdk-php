# Merging a new version (its CHANGELOG.md section) to main tags it; Packagist reads the tag.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: mirafive/.github/.github/workflows/php-sdk-release.yml@6ae9b1ce535cc43b442c79de244f74b6ee207455
    permissions:
      contents: write
