# Merging a new version (its CHANGELOG.md section) to main tags it; Packagist reads the tag.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: mirafive/.github/.github/workflows/php-sdk-release.yml@d99bb0580ad7349345520d9dd4f9d49d62c3d060
    permissions:
      contents: write
