name: Release

# Push a tag vX.Y.Z with a CHANGELOG section; Packagist picks the tag up by itself.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, curl
          coverage: none

      - name: Tag matches the code
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ -f src/Mira.php ]; then
            grep -q "VERSION = '$version'" src/Mira.php || { echo "::error::src/Mira.php VERSION is not $version"; exit 1; }
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer check

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" --notes-file notes.md
